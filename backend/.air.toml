root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  include_ext = ["go", "yaml", "yml"]
  exclude_dir = ["bin", "tmp", "uploads", ".tmp", "vendor"]
  exclude_regex = ["_test.go"]
  # Windows 挂载卷下 fsnotify 事件不可靠，启用轮询
  poll = true
  poll_interval = 800
  delay = 500

[log]
  time = true

[misc]
  clean_on_exit = true
