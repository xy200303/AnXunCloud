# Casbin 模型：RBAC with domains（domain 预留给多租户，当前统一 default）
# 资源标识直接为完整权限点字符串（如 system:user:list），不做路径拆分；
# obj 匹配支持两种通配：`*` 全量（超管）、`system:user:*` 模块级前缀（permMatch 自定义函数，
# 为整模块授权预留；不可用 keyMatch2——它会把 ':' 后内容当路径参数通配，导致同前缀权限点互相串权）。
[request_definition]
r = sub, dom, obj

[policy_definition]
p = sub, dom, obj

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && (p.obj == "*" || permMatch(r.obj, p.obj))
