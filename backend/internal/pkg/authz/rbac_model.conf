# Casbin 模型：RBAC with domains（domain 预留给多租户，当前统一 default）
# 权限点映射：system:user:list → obj=/system/user, act=list（按最后一个冒号拆分，见 authz.SplitPerm）
[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act)
