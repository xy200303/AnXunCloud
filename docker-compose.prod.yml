# 生产环境：postgres + redis + app（单服务单端口，后端托管前端 SPA）
# 启动：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: pi-prod
services:
  postgres:
    image: postgres:15-alpine
    container_name: pi-prod-prod-postgres
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${PI_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${PI_POSTGRES_PASSWORD:?need PI_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PI_POSTGRES_DBNAME:-property_inspection}
    # 不对外暴露端口，仅容器网络内访问
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pi-prod-prod-redis
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .                       # 根目录上下文（需同时构建 frontend/dist）
      dockerfile: Dockerfile
      target: prod
    container_name: pi-prod-prod-app
    env_file: .env.prod
    ports:
      - "18080:8080"                   # 唯一对外端口（避开本机 8080 占用）
    volumes:
      - uploads_prod:/app/uploads      # dev 上传模式下的文件持久化
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata_prod:
  redisdata_prod:
  uploads_prod:
