# 生产环境：postgres + redis + app（单服务单端口，后端托管前端 SPA）
# 启动：docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
name: anxuncloud-prod
services:
  postgres:
    image: postgres:15-alpine
    container_name: anxuncloud-prod-postgres
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?need POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DBNAME:-anxuncloud}
    # 不对外暴露端口，仅容器网络内访问
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: anxuncloud-prod-redis
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  app:
    build:
      context: .                       # 根目录上下文（需同时构建 frontend/dist）
      dockerfile: Dockerfile
      target: prod
    container_name: anxuncloud-prod-app
    env_file: .env.prod
    environment:
      LIBREOFFICE_MODE: worker
      LIBREOFFICE_WORKER_DIR: /render
    ports:
      - "18080:8080"                   # 唯一对外端口（避开本机 8080 占用）
    volumes:
      - uploads_prod:/app/uploads      # local 上传模式下的文件持久化（含官网发布物）
      - render_prod:/render
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      report-renderer:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  report-renderer:
    build:
      context: .
      dockerfile: Dockerfile
      target: report-renderer
    container_name: anxuncloud-prod-report-renderer
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    volumes:
      - render_prod:/render
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  pgdata_prod:
  redisdata_prod:
  uploads_prod:
  render_prod:
